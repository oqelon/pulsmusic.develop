# Выпуск Tauri-версии «Пульса» (Mac Apple M, Mac Intel, Windows x64). Запускается отправкой ветки tauri-release
# (версия — в desktop-tauri/RELEASE) или вручную. Собирает выпускной вариант (без «Лаборатории» и тестовых файлов,
# Pulse.app / установщик Windows, идентификатор ru.pulse.desktop) и кладёт архивы в релиз v<версия> (не «последний»).
# Для Mac — два файла: .zip (его берёт обновление внутри программы, на нём подпись) и .dmg (его скачивают с сайта).
# Подписи (mac.json, win.json, latest.json) ставит разработчик своим ключом и кладёт в updates/<версия>/ ветки main —
# только тогда обновление увидят программы. Ключа здесь нет.
name: Tauri — выпуск
on:
  workflow_dispatch:
  push:
    branches: [tauri-release]
permissions:
  contents: write
concurrency: tauri-release
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, out: Pulse-Mac-Apple-M.zip, kind: mac }
          - { os: macos-latest, target: x86_64-apple-darwin, out: Pulse-Mac-Intel.zip, kind: mac }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, out: Pulse-Windows-Setup.exe, kind: win }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
          command -v python3 || ln -s "$(command -v python)" /usr/bin/python3 || true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> target
          key: release-${{ matrix.target }}
      - name: Интерфейс
        run: bash desktop-tauri/prepare-ui.sh 0.38.0
      - name: Сборка
        working-directory: desktop-tauri
        env:
          CI: 'true'
          PULSE_RELEASE: '1'
        run: |
          VER=$(tr -d ' \r\n' < RELEASE)
          echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "версия: $VER"; exit 1; }
          rm -f ui/lab.html
          VER=$VER node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('src-tauri/tauri.release.conf.json','utf8'));c.version=process.env.VER;fs.writeFileSync('rel.conf.json',JSON.stringify(c,null,2));fs.writeFileSync('app-meta/package.json',JSON.stringify({name:'pulse',productName:'Пульс',version:process.env.VER,engine:'tauri',build:0},null,2)+'\n')"
          if [ "${{ matrix.kind }}" = mac ]; then B=app,dmg; else B=nsis; fi
          npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles $B --ci --config rel.conf.json
      - name: Упаковка (Mac)
        if: matrix.kind == 'mac'
        run: |
          B=desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/macos
          ls -la "$B"; test -d "$B/Pulse.app"
          cat "$B/Pulse.app/Contents/Resources/app/package.json"
          test ! -e "$B/Pulse.app/Contents/Resources/lab-media" && echo "лаборатории нет — ок"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$B/Pulse.app/Contents/Info.plist"
          codesign --verify --deep "$B/Pulse.app" && echo "codesign --verify --deep: ок"
          mkdir -p out && ditto -c -k --keepParent "$B/Pulse.app" "out/${{ matrix.out }}"
          # образ диска для сайта: Pulse.app и ярлык «Программы» — открыл и перетащил
          OUT="${{ matrix.out }}"; DMG="$(ls "$B"/../dmg/*.dmg | head -1)"; test -n "$DMG"
          hdiutil verify "$DMG" && echo "hdiutil verify: ок"
          cp "$DMG" "out/${OUT%.zip}.dmg"
          du -sh out/*
      - name: Упаковка (Windows)
        if: matrix.kind == 'win'
        run: |
          B=desktop-tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis
          ls -la "$B"
          mkdir -p out && cp "$B"/*.exe "out/${{ matrix.out }}"
          du -sh out/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kind }}-${{ matrix.target }}
          path: out/
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(tr -d ' \r\n' < desktop-tauri/RELEASE)
          ls -la out
          sha256sum out/*
          gh release create "v$VER" out/* -R "$GITHUB_REPOSITORY" --latest=false --target "$GITHUB_SHA" --title "Пульс $VER — версия Альфа" --notes "Пульс $VER — версия Альфа." \
            || gh release upload "v$VER" out/* -R "$GITHUB_REPOSITORY" --clobber
