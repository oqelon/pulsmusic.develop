:root { --a: #e84f9a; --b: #f5a1bb; --ink: #f4eef4; --ink2: #c9bfcb; --ink3: #9a8f9f;
  --ease: cubic-bezier(.16, 1, .3, 1); --io: cubic-bezier(.65, 0, .35, 1); --k: 1; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #060508; color: var(--ink); font-family: "Manrope", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.bg { position: fixed; inset: 0; background: linear-gradient(180deg, #120d16 0%, #060508 78%); }
.stage { position: fixed; left: 50%; top: 50%; width: 944px; height: 620px; margin: -310px 0 0 -472px; transform: scale(var(--k)); }
.gl { background: rgba(30,25,36,.42); -webkit-backdrop-filter: blur(30px) saturate(1.5); backdrop-filter: blur(30px) saturate(1.5); border: 1px solid rgba(255,255,255,.10); box-shadow: inset 0 1px 0 rgba(255,255,255,.07); }
.ico { display: inline-flex; width: 20px; height: 20px; flex: none; } .ico svg { width: 100%; height: 100%; }

/* звезда на фоне */
.starw { position: absolute; pointer-events: none; transform-origin: 36.28% 45.64%; filter: brightness(.5); animation: breathe 8s ease-in-out infinite; transition: opacity .8s ease; }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
.starw.bloom { animation: bloom 1.8s var(--ease) both, breathe 8s ease-in-out 1.8s infinite; }
@keyframes bloom { 0% { filter: brightness(2) saturate(1.2); } 100% { filter: none; } }

.prog4 { position: absolute; right: 40px; top: 52px; display: flex; gap: 6px; } .prog4 i { width: 24px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); transition: background .5s; } .prog4 i.on { background: var(--b); } .prog4 i.done { background: rgba(245,161,187,.45); }

/* колонка слева */
.col { position: absolute; left: 40px; top: 104px; width: 400px; height: 384px; }
.col > div { display: flex; flex-direction: column; }
.cap { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink3); }
.ttl { margin-top: 12px; font-size: 44px; line-height: 48px; letter-spacing: -.03em; font-weight: 800; }
.ttl .wd { display: inline-block; }
.lead { margin-top: 16px; font-size: 16px; line-height: 24px; color: var(--ink2); }
.cover { width: 96px; height: 96px; margin-bottom: 24px; filter: drop-shadow(0 14px 30px rgba(232,79,154,.4)); } .cover img { width: 96px; height: 96px; display: block; }
.in { opacity: 0; transform: translateY(12px); animation: rise .9s var(--ease) forwards; }
@keyframes rise { to { opacity: 1; transform: none; } }
.out > * { animation: out .2s var(--io) forwards !important; pointer-events: none !important; }
@keyframes out { to { opacity: 0; transform: translateY(-8px); } }
.pct { margin-top: 12px; font-size: 80px; line-height: 80px; font-weight: 800; letter-spacing: -.05em; font-variant-numeric: tabular-nums; background: linear-gradient(180deg in oklch, #fff 0%, #fff 45%, var(--b) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pct small { font-size: 28px; letter-spacing: 0; margin-left: 2px; }
.stepl { margin-top: 16px; display: flex; align-items: center; gap: 10px; font-size: 16px; line-height: 24px; color: #d9cfdc; }
.dotp { width: 8px; height: 8px; border-radius: 4px; background: var(--b); box-shadow: 0 0 10px var(--a); animation: dp 1.2s ease-in-out infinite; flex: none; } @keyframes dp { 50% { opacity: .35; } }
.note { margin-top: 24px; font-size: 14px; line-height: 20px; color: var(--ink3); }
.okc { width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg in oklch, var(--a), var(--b)); box-shadow: 0 10px 30px rgba(232,79,154,.4); }
.okc svg { width: 26px; height: 26px; } .okc path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .7s var(--ease) .35s forwards; } @keyframes draw { to { stroke-dashoffset: 0; } }
.done .ttl { margin-top: 24px; }
.errbox { margin-top: 24px; max-height: 168px; overflow: auto; border-radius: 20px; padding: 14px 18px; font-size: 14px; line-height: 20px; color: #f3dbe4; background: rgba(232,79,154,.10); border: 1px solid rgba(232,79,154,.28); user-select: text; cursor: text; }
/* настройки */
.lbl { margin-top: 24px; font-size: 13px; line-height: 16px; font-weight: 700; color: var(--ink3); padding-left: 18px; }
.field { margin-top: 8px; height: 52px; border-radius: 26px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 18px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10); transition: border-color .2s, box-shadow .2s; }
.field:focus-within { border-color: rgba(245,161,187,.6); box-shadow: 0 0 0 3px rgba(232,79,154,.18); }
.field input { flex: 1; min-width: 0; height: 100%; font: inherit; font-size: 14px; color: var(--ink); background: none; border: 0; outline: none; user-select: text; cursor: text; }
.spill { height: 36px; padding: 0 16px; border-radius: 18px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 700; background: rgba(255,255,255,.10); flex: none; transition: background .2s; } .spill:hover { background: rgba(255,255,255,.16); }
.hint { margin-top: 8px; padding-left: 18px; font-size: 12px; line-height: 16px; color: var(--ink3); min-height: 16px; }
.card { margin-top: 16px; border-radius: 22px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); overflow: hidden; }
.row { width: 100%; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 12px 0 18px; text-align: left; transition: background .2s; } .row:hover { background: rgba(255,255,255,.04); }
.row + .row { border-top: 1px solid rgba(255,255,255,.06); }
.row .t { flex: 1; min-width: 0; } .row b { display: block; font-size: 14px; line-height: 18px; font-weight: 700; } .row small { display: block; font-size: 12px; line-height: 16px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tg { width: 44px; height: 26px; border-radius: 13px; background: rgba(255,255,255,.16); position: relative; flex: none; transition: background .3s; }
.tg::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 10px; background: #fff; transition: transform .35s var(--ease); }
.tg.on { background: linear-gradient(90deg in oklch, var(--a), var(--b)); } .tg.on::after { transform: translateX(18px); }

/* живой текст — как в программе: текущая строка заливается, прошлые и будущие — в мягком размытии */
.scene { position: absolute; left: 480px; top: 104px; width: 424px; height: 384px; }
.lyr { position: absolute; inset: 0; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 18%, #000 82%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 18%, #000 82%, transparent 100%); }
.lst { position: absolute; left: 0; right: 0; top: 0; transition: transform .95s var(--ease), opacity .3s; will-change: transform; }
.lst.swap { opacity: 0; }
.ln { height: 64px; display: flex; align-items: center; white-space: nowrap; font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -.02em; color: rgba(255,255,255,.5); transform-origin: 0 50%;
  transition: filter .6s var(--ease), opacity .6s var(--ease), transform .6s var(--ease), color .6s; }
.ln .t { position: relative; display: inline-block; --x: -40px; }
.ln .t::after { content: attr(data-t); position: absolute; left: -.5em; top: -.45em; padding: .45em .5em; color: #fff; pointer-events: none; white-space: pre; opacity: 0; transition: opacity .4s;
  text-shadow: 0 0 3px rgba(255,255,255,.28), 0 0 12px rgba(232,79,154,.3);
  -webkit-mask-image: linear-gradient(90deg, #000 calc(var(--x) - 16px), transparent calc(var(--x) + 16px)); mask-image: linear-gradient(90deg, #000 calc(var(--x) - 16px), transparent calc(var(--x) + 16px)); }
.ln.cur { color: rgba(255,255,255,.36); transform: scale(1.035); } .ln.cur .t::after { opacity: 1; }
.ln.p1, .ln.p2, .ln.p3 { color: #fff; }
.ln.p1 { filter: blur(3px); opacity: .45; } .ln.p2 { filter: blur(5px); opacity: .3; } .ln.p3 { filter: blur(7px); opacity: .18; }
.ln.n1 { filter: blur(.6px); opacity: .78; } .ln.n2 { filter: blur(1.4px); opacity: .6; } .ln.n3 { filter: blur(2.4px); opacity: .45; } .ln.n4 { filter: blur(3.4px); opacity: .32; }

/* капсула */
.dock { position: absolute; left: 28px; right: 28px; bottom: 28px; height: 72px; border-radius: 36px; overflow: hidden; opacity: 0; transform: translateY(24px); animation: rise 1s var(--ease) .4s forwards; }
.dock::before { content: ""; position: absolute; top: 0; bottom: 0; width: 120px; left: -140px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent); transform: skewX(-20deg); animation: sheen 7s ease-in-out 1.8s infinite; pointer-events: none; }
@keyframes sheen { 0% { left: -140px; } 28%, 100% { left: 105%; } }
.dk { position: absolute; inset: 0; display: flex; align-items: center; gap: 14px; padding: 0 12px; }
.dk > * { animation: fade .45s var(--ease) both; } @keyframes fade { from { opacity: 0; } }
.dk .art { width: 48px; height: 48px; flex: none; } .dk .art img { width: 48px; height: 48px; border-radius: 24px; display: block; }
.dk .art.spin img { animation: spin 10s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
.dk .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; } .dk .tx b { font-size: 15px; line-height: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dk .tx small { font-size: 12.5px; line-height: 16px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .dk .tx small.bad { color: #f7b6cc; }
.btn { height: 48px; border-radius: 24px; padding: 0 22px; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; position: relative; flex: none; transition: transform .15s var(--io), background .2s, opacity .2s; }
.btn:active { transform: scale(.97); } .btn .ico { width: 17px; height: 17px; }
.btn.pri { background: #fff; color: #0b090e; } .btn.gh { background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); } .btn.gh:hover { background: rgba(255,255,255,.13); }
.btn.pri::after { content: ""; position: absolute; inset: -4px; border-radius: 28px; animation: ping 3s ease-out 2.2s infinite; pointer-events: none; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(245,161,187,.5); } 70%, 100% { box-shadow: 0 0 0 10px rgba(245,161,187,0); } }
.btn:disabled, .cb:disabled, .spill:disabled { opacity: .5; cursor: default; pointer-events: none; }
.btn:focus-visible, .cb:focus-visible, .spill:focus-visible, .row:focus-visible { outline: 2px solid var(--b); outline-offset: 2px; }
.cb { width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.08); flex: none; transition: background .2s; } .cb:hover { background: rgba(255,255,255,.14); } .cb .ico { width: 18px; height: 18px; }
.tm { font-size: 13px; color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 72px; text-align: right; }
.dprog { position: absolute; left: 36px; right: 36px; bottom: 0; height: 3px; border-radius: 2px; background: rgba(255,255,255,.07); opacity: 0; transition: opacity .4s; } .dprog.on { opacity: 1; }
.dprog i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: linear-gradient(90deg in oklch, rgba(232,79,154,0) 0%, var(--a) 26%, var(--b) 100%); }
.dprog i::after { content: ""; position: absolute; right: -4px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: #fff6fa; box-shadow: 0 0 12px 4px rgba(245,161,187,.5); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style></head>

  const col = $('col'), dk = $('dk');
  const put = () => { if (g !== gen) return; col.classList.remove('out'); dk.classList.remove('out'); col.innerHTML = colH; dk.innerHTML = dockH; };
  if (col.firstChild) { col.classList.add('out'); dk.classList.add('out'); setTimeout(put, 200); } else put();
  $('dprog').classList.toggle('on', name === 'install' || name === 'done');
  starState(name, S.pct / 100);
  if (name === 'welcome' || name === 'settings') { lyrSet('w', WELCOME); t0 = performance.now(); }
  else lyrSet('i', INSTALL);
}
const W = (t, d0 = .16) => t.split(' ').map((w, i) => `<span class="wd in" style="animation-delay:${(d0 + i * .06).toFixed(2)}s">${w}</span>`).join(' ');
const need = () => gb(info.embedded ? 300 : info.needMB);

function welcome() {
  const upd = info.installed;
  render('welcome', `<div><div class="cover in"><img src="${ICON}" alt=""></div><div class="cap in" style="animation-delay:.08s">${upd ? 'Обновление' : 'Установка'}${info.version ? ' · версия ' + esc(info.version) : ''}</div>
      <h1 class="ttl">${W(upd ? 'Новый «Пульс» уже звучит' : 'Слушайте, как звучит «Пульс»')}</h1>${upd ? '<p class="lead in" style="animation-delay:.5s">Вход, любимые треки и настройки сохранятся.</p>' : ''}</div>`,
    `<span class="art"><img src="${ICON}" alt=""></span><span class="tx"><b>${esc(info.name)}</b><small>${info.version ? 'Версия ' + esc(info.version) + ' · ' : ''}займёт около ${need()} · нужен аккаунт Яндекс Музыки</small></span>
      <button class="btn gh" data-go="settings">${ic('gear')}Настроить</button><button class="btn pri" data-go="install">${upd ? 'Обновить' : 'Установить'}</button>`, 0);
}
function settings() {
  render('settings', `<div><div class="cap in">Шаг 2 из 4</div><h1 class="ttl">${W('Настройки')}</h1>
      <div class="lbl in" style="animation-delay:.2s">Папка</div>
      <div class="field in" style="animation-delay:.24s"><input id="dir" spellcheck="false" value="${esc(opts.dir)}" aria-label="Папка установки"><button class="spill" data-act="pick">Изменить</button></div>
      <div class="hint in" id="dirhint" style="animation-delay:.28s">Можно выбрать кнопкой или вписать путь вручную</div>
      <div class="card in" style="animation-delay:.32s">
        <button class="row" data-tg="desktop"><span class="t"><b>Ярлык на рабочем столе</b><small>«${esc(info.name)}»</small></span><span class="tg ${opts.desktop ? 'on' : ''}"></span></button>
        <button class="row" data-tg="startMenu"><span class="t"><b>В меню «Пуск»</b><small>Рядом с остальными программами</small></span><span class="tg ${opts.startMenu ? 'on' : ''}"></span></button>
        <button class="row" data-tg="autostart"><span class="t"><b>Запускать вместе с Windows</b><small>«Пульс» откроется сам при включении</small></span><span class="tg ${opts.autostart ? 'on' : ''}"></span></button>
      </div></div>`,
    `<span class="art"><img src="${ICON}" alt=""></span><span class="tx"><b>Нужно около ${need()}</b><small id="space">Свободно ${gb(info.freeMB)} · права администратора не нужны</small></span>
      <button class="btn gh" data-go="welcome">Назад</button><button class="btn pri" data-go="install">${info.installed ? 'Обновить' : 'Установить'}</button>`, 1);
}
function installing() {
  render('install', `<div><div class="cap in">Шаг 3 из 4 · установка</div><div class="pct in" style="animation-delay:.08s"><span id="pc">0</span><small>%</small></div>
      <div class="stepl in" style="animation-delay:.16s"><span class="dotp"></span><span id="sl">${esc(INSTALL[0])}</span></div>
      <p class="note in" style="animation-delay:.24s">Окно можно свернуть — установка продолжится.</p></div>`,
    `<span class="art spin"><img src="${ICON}" alt=""></span><span class="tx"><b>Установка «Пульса»</b><small id="ds">Начинаю…</small></span><span class="tm" id="eta"></span>
      <button class="cb" data-act="cancel" title="Отменить установку" aria-label="Отменить установку">${ic('close')}</button>`, 2);
  pollLoop();
}
function failed(err) {
  render('error', `<div><div class="cap in">Установка остановилась</div><h1 class="ttl">${W('Не получилось')}</h1>
      <div class="errbox in" style="animation-delay:.4s">${esc(err || 'Неизвестная ошибка')}</div></div>`,
    `<span class="art"><img src="${ICON}" alt=""></span><span class="tx"><b>Можно попробовать ещё раз</b><small>Уже скачанное не потеряется</small></span>
      <button class="btn gh" data-act="quit">Закрыть</button><button class="btn gh" data-go="settings">Другая папка</button><button class="btn pri" data-act="retry">Повторить</button>`, 2);
}
function done() {
  const where = [opts.desktop && 'на рабочем столе', opts.startMenu && 'в меню «Пуск»'].filter(Boolean).join(' и ');
  render('done', `<div class="done"><div class="okc in"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1 class="ttl">${W('Готово. Звезда горит.', .2)}</h1><p class="lead in" style="animation-delay:.5s">${where ? 'Ярлык «' + esc(info.name) + '» — ' + where + '.' : 'Всё на месте — можно открывать.'}</p></div>`,
    `<span class="art"><img src="${ICON}" alt=""></span><span class="tx"><b>«Пульс» установлен</b><small id="dsd">При первом запуске войдите в аккаунт Яндекс Музыки</small></span>
      <button class="btn gh" data-act="quit">Закрыть</button><button class="btn pri" data-act="launch">${ic('play')}Открыть «Пульс»</button>`, 3);
}

// ---------- установка: опрос состояния ----------
let pollGen = 0;
async function pollLoop() {
  const g = ++pollGen; let fails = 0;
  while (g === pollGen && cur === 'install') {
    let s = null; try { s = await api('/api/state'); fails = 0; } catch (e) { fails++; }
    if (g !== pollGen || cur !== 'install') return;
    if (s) {
      S = s;
      if (s.phase === 'done') { S.pct = 100; await sleep(650); if (cur === 'install') done(); return; }
      if (s.phase === 'error') { failed(s.err); return; }
      if (s.phase === 'cancelled' || s.phase === 'idle') { welcome(); return; }
      const ds = $('ds'); if (ds) { ds.textContent = s.detail || ''; ds.classList.remove('bad'); }
      const eta = $('eta'); if (eta) eta.textContent = s.eta || '';
    } else if (fails > 20) { const ds = $('ds'); if (ds) { ds.textContent = 'Установщик не отвечает — подождите или перезапустите его'; ds.classList.add('bad'); } }
    await sleep(250);
  }
}
function lineFor(pct, step, phase) {
  if (phase === 'done' || cur === 'done') return [5, 1];
  const i = step >= 3 && pct >= 96 ? 4 : Math.min(3, step); const [a, b] = RANGE[i];
  return [i, (pct - a) / (b - a)];
}
// кадр: живой текст, проценты, полоска
function frame(now) {
  if (cur === 'welcome' || cur === 'settings') { const e = (now - t0) / 1000, per = 3.2, k = Math.floor(e / per); lyrGo(k % WELCOME.length, Math.min(1, (e - k * per) / 2.6)); }
  else {
    const target = cur === 'done' ? 100 : Math.max(0, Math.min(100, S.pct || 0)); shown += (target - shown) * .08; if (Math.abs(target - shown) < .05) shown = target;
    const [i, f] = lineFor(shown, S.step || 0, S.phase); lyrGo(i, f);
    const pc = $('pc'); if (pc) pc.textContent = Math.floor(shown);
    const sl = $('sl'); if (sl && cur === 'install') sl.textContent = INSTALL[i];
    $('dp').style.width = shown.toFixed(2) + '%';
    if (cur === 'install') starState('install', shown / 100);
  }
  requestAnimationFrame(frame);
}

// ---------- кнопки: один обработчик на всё окно — не теряется при смене экранов ----------
let pending = false;
function hint(txt) { const sm = $('dk').querySelector('.tx small'); if (sm) { sm.textContent = txt; sm.classList.add('bad'); } }
$('stage').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-go],[data-act],[data-tg]');
  if (!b || b.disabled || b.closest('.out')) return;
  if (b.dataset.tg) { const k = b.dataset.tg; opts[k] = !opts[k]; b.querySelector('.tg').classList.toggle('on', opts[k]); return; }
  if (pending && b.dataset.act !== 'quit') return;
  pending = true; b.disabled = true;
  try { if (b.dataset.go) await go(b.dataset.go, b); else await act(b.dataset.act, b); }
  finally { pending = false; if (document.contains(b)) b.disabled = false; }
});
async function startInstall() {
  try { const s = await api('/api/install', opts); S = s && s.phase ? s : { phase: 'installing', pct: 0, step: 0 }; shown = 0; installing(); }
  catch (e) { hint('Установщик не ответил — нажмите ещё раз'); }
}
async function go(where) {
  if (where === 'settings') settings();
  else if (where === 'welcome') welcome();
  else if (where === 'install') await startInstall();
}
async function act(a, b) {
  if (a === 'pick') {
    b.textContent = 'Открываю…'; const h = $('dirhint'); h.textContent = 'Выберите папку в открывшемся окне';
    let r = {}; try { r = await api('/api/pickdir?dir=' + encodeURIComponent(opts.dir), undefined, 0); } catch (e) {}
    b.textContent = 'Изменить';
    if (r.dir) { opts.dir = r.dir; $('dir').value = r.dir; spaceFor(r.freeMB); h.textContent = '«Пульс» установится в эту папку'; }
    else h.textContent = r.err ? 'Окно выбора не открылось — впишите путь вручную' : 'Папка не изменилась';
  } else if (a === 'cancel') {
    try { await api('/api/cancel', {}); const ds = $('ds'); if (ds) ds.textContent = 'Отменяю…'; } catch (e) { hint('Не получилось отменить — нажмите ещё раз'); }
  } else if (a === 'retry') await startInstall();
  else if (a === 'launch') {
    let r = null; try { r = await api('/api/launch', {}); } catch (e) {}
    if (r && r.ok) { quitting = true; setTimeout(() => window.close(), 300); }
    else hint(r ? 'Не получилось открыть — откройте «Пульс» ярлыком' : 'Установщик не ответил — нажмите ещё раз');
  } else if (a === 'quit') { quitting = true; try { await api('/api/quit', {}, 1500); } catch (e) {} window.close(); }
}
function spaceFor(free) { const e = $('space'); if (e) e.textContent = 'Свободно ' + gb(free) + ' · права администратора не нужны'; }
let freeT = 0;
document.addEventListener('input', (e) => {
  if (e.target.id !== 'dir') return;
  opts.dir = e.target.value.trim();
  clearTimeout(freeT); freeT = setTimeout(async () => { try { const r = await api('/api/free?dir=' + encodeURIComponent(opts.dir)); spaceFor(r.freeMB); } catch (er) {} }, 400);
});
let quitting = false;
addEventListener('pagehide', () => { if (!quitting) navigator.sendBeacon('/api/quit?t=' + TOKEN); });
addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id !== 'dir' && !e.target.closest('button')) { const p = $('dk').querySelector('.btn.pri:not(:disabled)'); if (p) p.click(); } });
addEventListener('contextmenu', (e) => { if (e.target.id !== 'dir') e.preventDefault(); });
addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
// окно может быть чуть больше или меньше задуманного — сетка масштабируется целиком
const fit = () => document.documentElement.style.setProperty('--k', Math.min(innerWidth / 944, innerHeight / 620).toFixed(4));
addEventListener('resize', fit); fit();
try { if (Math.abs(outerWidth - 960) > 80 || Math.abs(outerHeight - 660) > 80) { resizeTo(960, 660); moveTo((screen.availWidth - 960) / 2, (screen.availHeight - 660) / 2); } } catch (e) {}
// пульс окна: установщик видит, что окно живо, и не закрывается, пока вы читаете
setInterval(() => { if (cur !== 'install') api('/api/state', undefined, 4000).then((s) => { if (s && s.phase) S = Object.assign(S, cur === 'done' ? {} : s); }).catch(() => {}); }, 5000);
(async () => {
  for (let k = 0; k < 3; k++) { try { info = await api('/api/info'); break; } catch (e) { await sleep(400); } }
  opts.dir = info.dir || '';
  if (!info.embedded) INSTALL[1] = 'Скачиваю Electron';
  let s = null; try { s = await api('/api/state'); } catch (e) {}
  if (s && s.phase === 'installing') { S = s; installing(); }
  else if (s && s.phase === 'done') { S = s; shown = 100; done(); }
  else welcome();
  requestAnimationFrame(frame);
})();
</script>
</body></html>
