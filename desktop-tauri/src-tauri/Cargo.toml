[package]
name = "pulse-tauri"
version = "0.38.0"
description = "Пульс — тестовая сборка на Tauri 2 (этапы 2–3 миграции: звук на macOS)"
edition = "2021"
publish = false

[lib]
name = "pulse_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# этап 3: звук Яндекса (запрос к серверу, расшифровка AES-CTR)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
aes = "0.8"
ctr = "0.9"
getrandom = "0.2"
# этап 4: запросы к Яндексу из окна, открытие ссылок, токен в Связке ключей
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
