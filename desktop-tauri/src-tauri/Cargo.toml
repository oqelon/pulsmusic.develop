[package]
name = "pulse-tauri"
version = "0.38.0"
description = "Пульс — тестовая сборка на Tauri 2 (этапы 2–3 миграции: звук на macOS)"
edition = "2021"
publish = false

[lib]
name = "pulse_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# этап 3: звук Яндекса (запрос к серверу, расшифровка AES-CTR)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
aes = "0.8"
ctr = "0.9"
getrandom = "0.2"
# этап 4: запросы к Яндексу из окна, открытие ссылок, токен в Связке ключей
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-opener = "2"
# PULSE Audio Engine: вывод звука, декодирование, пересчёт частоты
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# этап 5: перенос данных из Electron — расшифровка safeStorage (macOS: PBKDF2-SHA1 + AES-128-CBC)
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
sha1 = "0.10"
# этап 6.2: обновления по воздуху — подпись разработчика (Ed25519, как updsign.js) и SHA-256 архива
ed25519-dalek = "2"
# перенос из Electron на Windows: safeStorage = AES-256-GCM, ключ под DPAPI
aes-gcm = "0.10"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_System_Power"] }

