[package]
name = "pulse-tauri"
version = "0.38.0"
description = "Пульс — тестовая сборка на Tauri 2 (этап 2 миграции: проверка совместимости звука на macOS)"
edition = "2021"
publish = false

[lib]
name = "pulse_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
