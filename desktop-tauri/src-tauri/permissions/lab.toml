[[permission]]
identifier = "allow-lab"
description = "Команды тестового окна «Лаборатория звука»: выбрать свои файлы, сохранить отчёт, сведения о системе, открыть интерфейс с демо-данными, тестовые потоки, формат звука Яндекса."
commands.allow = ["pick_files", "save_report", "env_info", "open_ui", "ya_fmt", "lab_streams", "lab_ya_log", "lab_ya_log_last", "lab_ya_recent"]

[[permission]]
identifier = "allow-player"
description = "Окно «Пульса»: зарегистрировать ссылку на звук Яндекса (ya_add), узнать её формат (ya_fmt), сохранить токен в Связке ключей (token_set)."
commands.allow = ["ya_fmt", "ya_add", "token_set", "ya_login", "engine_create", "engine_drop", "engine_open", "engine_play", "engine_pause", "engine_seek", "engine_volume", "engine_rate", "engine_state", "engine_eq", "engine_tap", "engine_info", "engine_devices", "engine_set_device"]
